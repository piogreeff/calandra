name = "calandra-api"
main = "src/index.ts"
compatibility_date = "2026-06-21"

[vars]
APP_URL = "https://calandra.pages.dev"
DATASET_R2_PREFIX = "datasets"

[[kv_namespaces]]
binding = "ECONOMY"
id = "replace-with-cloudflare-kv-id"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "calandra-data"

[[vectorize]]
binding = "KNOWLEDGE"
index_name = "calandra-knowledge"
