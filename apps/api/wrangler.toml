name = "calandra-api"
main = "src/index.ts"
compatibility_date = "2026-06-21"

[vars]
APP_URL = "https://calandra.pages.dev"
DATASET_R2_PREFIX = "datasets"
SNAPSHOT_R2_PREFIX = "snapshots"
GGG_TOKEN_R2_PREFIX = "oauth/ggg"
GGG_USER_AGENT = "calandra/0.1.0 (+https://calandra.pages.dev; piogreeff@users.noreply.github.com)"

[[kv_namespaces]]
binding = "ECONOMY"
id = "afc8f30fee77488a97916a46af96e9c6"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "calandra-data"

[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "calandra-data"

[[vectorize]]
binding = "KNOWLEDGE"
index_name = "calandra-knowledge"
