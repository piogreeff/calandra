name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source=/repo --redact --verbose
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:scaffold
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docs:current
      - run: pnpm license:check
